[project]
name = "trustcurve"
version = "0.1.0"
description = "Model-agnostic interpretability plots: PDP, ICE, ALE. Polars-first, works with any predict function."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "J Xu" }]
keywords = ["interpretability", "pdp", "ice", "ale", "machine-learning", "polars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "scikit-learn", "xgboost"]
sklearn = ["scikit-learn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
